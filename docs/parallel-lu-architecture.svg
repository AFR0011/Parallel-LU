<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Parallel-LU maintained MPI-lite architecture</title>
  <desc id="desc">Synthetic diagram of a driver coordinating two loopback workers and verifying the gathered solution.</desc>
  <rect width="1200" height="520" fill="#0b1020"/>
  <text x="60" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="700">Parallel-LU · verified MPI-lite path</text>
  <text x="60" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Synthetic architecture illustration · not a performance benchmark</text>

  <g font-family="system-ui, sans-serif">
    <rect x="60" y="155" width="310" height="220" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="92" y="202" fill="#dbeafe" font-size="24" font-weight="700">Canonical driver</text>
    <text x="92" y="244" fill="#bfdbfe" font-size="17">deterministic generation</text>
    <text x="92" y="276" fill="#bfdbfe" font-size="17">pivot and row-swap control</text>
    <text x="92" y="308" fill="#bfdbfe" font-size="17">gather and solve</text>
    <text x="92" y="340" fill="#bfdbfe" font-size="17">residual pass/fail</text>

    <path d="M390 230 H500" stroke="#64748b" stroke-width="4"/>
    <path d="M390 310 H500" stroke="#64748b" stroke-width="4"/>
    <path d="M487 219 L502 230 L487 241" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M487 299 L502 310 L487 321" fill="none" stroke="#64748b" stroke-width="4"/>

    <rect x="520" y="145" width="300" height="145" rx="20" fill="#16332d" stroke="#34d399" stroke-width="2"/>
    <text x="550" y="192" fill="#d1fae5" font-size="23" font-weight="700">Worker 1 · row block</text>
    <text x="550" y="232" fill="#a7f3d0" font-size="17">pivot scan + OpenMP update</text>
    <text x="550" y="261" fill="#a7f3d0" font-size="17">127.0.0.1 by default</text>

    <rect x="520" y="310" width="300" height="145" rx="20" fill="#16332d" stroke="#34d399" stroke-width="2"/>
    <text x="550" y="357" fill="#d1fae5" font-size="23" font-weight="700">Worker 2 · row block</text>
    <text x="550" y="397" fill="#a7f3d0" font-size="17">pivot scan + OpenMP update</text>
    <text x="550" y="426" fill="#a7f3d0" font-size="17">127.0.0.1 by default</text>

    <rect x="880" y="205" width="260" height="190" rx="20" fill="#3b1d44" stroke="#c084fc" stroke-width="2"/>
    <text x="910" y="252" fill="#f3e8ff" font-size="23" font-weight="700">Protocol boundary</text>
    <text x="910" y="292" fill="#e9d5ff" font-size="17">version 1 · 64 MiB cap</text>
    <text x="910" y="323" fill="#e9d5ff" font-size="17">30 s connected I/O</text>
    <text x="910" y="354" fill="#e9d5ff" font-size="17">trusted homogeneous lab</text>
  </g>

  <path d="M835 300 H865" stroke="#64748b" stroke-width="4"/>
  <path d="M852 289 L867 300 L852 311" fill="none" stroke="#64748b" stroke-width="4"/>
  <text x="600" y="492" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">Optional MS-MPI source is outside the verified release surface</text>
</svg>
